sensors:
  - xtion_pointcloud

xtion_pointcloud:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: "/cropped_points" # /point_cloud/points
  max_range: 1.5
  point_subsample: 2  # Cantidad de puntos de la nube para construir un voxel
  padding_offset: 0.08  # Margen de seguridad en las mallas de robot
  padding_scale: 1.0 # Factor multiplicador del volumen de los eslabones del robot para el auto-filtrado.
  max_update_rate: 5.0 # Cantidad máxima de veces por segundo que MoveIt recalcula el mapa de vóxeles.
  filtered_cloud_topic: /filtered_points # topico donde se publica en moveit la nube filtrada 